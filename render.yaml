services:
  - type: web
    name: yc-launch-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn yc_launch_monitor.pond.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POND_ACCESS_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: POLL_INTERVAL_HOURS
        value: "1"
